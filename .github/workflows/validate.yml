name: Validate ZSP lab safety

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: function/requirements.lock

      - name: Enforce hash-locked Function dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r function/requirements.txt

      - name: Compile Python
        run: python -m compileall -q function

      - name: Run offline safety tests
        run: python -m unittest discover -s function/tests -v

      - name: Parse PowerShell entry points
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw ($errors | ForEach-Object Message | Out-String)
            }
          }

      - name: Compile Bicep
        run: |
          az bicep build --file bicep/main.bicep --stdout >/dev/null
          az bicep build-params --file bicep/main.bicepparam --stdout >/dev/null
