name: Validate ZSP lab safety

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      dependency_snapshot: ${{ steps.dependency-evidence.outputs.snapshot }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            function/requirements.txt
            function/pins.txt

      - name: Create isolated Function runtime
        run: |
          python -m venv "$RUNNER_TEMP/zsp-runtime"
          echo "$RUNNER_TEMP/zsp-runtime/bin" >> "$GITHUB_PATH"

      - name: Enforce hash-locked Function dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r function/requirements.txt --ignore-installed --report "$RUNNER_TEMP/pip-install-report.json"

      - name: Compile Python
        run: python -m compileall -q function

      - name: Import the actual hash-locked Function runtime
        run: python -c "import sys; sys.path.insert(0, 'function'); import function_app; assert function_app.app.get_functions()"

      - name: Run offline safety tests
        run: python -m unittest discover -s function/tests -v

      - name: Parse PowerShell entry points
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw ($errors | ForEach-Object Message | Out-String)
            }
          }

      - name: Compile Bicep
        run: |
          az bicep build --file bicep/main.bicep --stdout >/dev/null
          az bicep build-params --file bicep/main.bicepparam --stdout >/dev/null

      - name: Prepare verified runtime dependency evidence
        id: dependency-evidence
        run: python scripts/dependency_snapshot.py --report "$RUNNER_TEMP/pip-install-report.json"

  submit-dependencies:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # This job runs no repository code and receives only bounded package
      # metadata from the successful read-only validation job on main.
      - name: Submit the verified runtime snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_SNAPSHOT: ${{ needs.validate.outputs.dependency_snapshot }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          snapshot = json.loads(os.environ['DEPENDENCY_SNAPSHOT'])
          if snapshot['sha'] != os.environ['GITHUB_SHA'] or snapshot['ref'] != 'refs/heads/main':
              raise SystemExit('Dependency evidence does not match this main commit')
          Path(os.environ['RUNNER_TEMP'], 'dependency-snapshot.json').write_text(json.dumps(snapshot), encoding='utf-8')
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            --input "$RUNNER_TEMP/dependency-snapshot.json"
