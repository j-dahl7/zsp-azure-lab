version: 2

# This repository is the source of truth for these dependencies. It is mirrored
# byte-for-byte into nine-lives-security/nine-lives-zero-trust, where a
# provenance check rejects any edit made downstream. Dependency updates
# therefore have to land here first, or they cannot be merged anywhere.

updates:
  - package-ecosystem: "pip"
    directory: "/function"
    schedule:
      interval: "weekly"
    # Version updates are off for this folder. requirements.txt is a
    # hash-locked entry file over pins.txt, refreshed by hand with uv, and
    # Dependabot regenerates it as the unhashed output of requirements.in,
    # so its pull requests fail the hash-enforced install. A limit of 0
    # stops version-update pull requests only: security update pull
    # requests have their own fixed limit, and alerts are unaffected.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    ignore:
      # This Function App is deployed on Python 3.12. azure-functions 2.x is
      # specifically the Python 3.13+ package line.
      - dependency-name: "azure-functions"
        update-types:
          - "version-update:semver-major"
    groups:
      pip-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
